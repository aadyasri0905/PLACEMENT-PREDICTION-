<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🎓 Placement Predictor</h1>

        <p class="subtitle">
            Predict whether a student is likely to be placed based on CGPA and IQ.
        </p>

        <form action="/predict" method="POST">

            <input
                type="number"
                name="cgpa"
                step="0.01"
                placeholder="Enter CGPA"
                required>

            <input
                type="number"
                name="iq"
                placeholder="Enter IQ"
                required>

            <button type="submit">
                Predict Placement
            </button>

        </form>

        {% if prediction_text %}
        <div class="result">
            <h2>{{ prediction_text }}</h2>
        </div>
        {% endif %}

    </div>

</body>

</html>
